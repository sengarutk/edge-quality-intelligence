listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
# QoS 1 events queued per offline persistent client. Mosquitto's default (1000) covers only about
# 33 s of subscriber downtime at 30 events/s; excess events are dropped by the broker after it has
# acknowledged them to the publisher, so the edge spool cannot recover them
# (results/spooler_stress/delivery_failures_summary.json). 108000 = 1 h at 30 events/s.
max_queued_messages 108000
